[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-precedent-chainer"
version = "0.1.0"
description = "Graph + embeddings based legal precedent path finder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "networkx>=3.3",
  "numpy>=2.0.0",
  "requests>=2.32.0",
  "pydantic>=2.8.0",
  "pytest>=8.3.0",
  "httpx>=0.27.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
